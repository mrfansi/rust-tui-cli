name: Release

# Tagging is the whole trigger: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]
  # Runnable by hand against a tag, for when a release job failed on something
  # that had nothing to do with the code.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Written out rather than generated by a release tool. A generator that emits
# three hundred lines of YAML it owns is the same third-party dependency in the
# path between a commit and a published binary that this repo declined to take
# on for the toolchain — and the whole job is five targets and a checksum.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # musl as well as gnu: a statically linked binary runs on the old
          # distributions and the scratch containers that a glibc build refuses.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Read from Cargo.toml, not hard-coded, so this workflow still works after
      # rename.sh has been run on a copy of this template.
      - name: Package name
        id: pkg
        shell: bash
        run: echo "name=$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # tar on Unix, zip on Windows: handing a Windows user a .tar.gz is handing
      # them a second problem.
      - name: Archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          name='${{ steps.pkg.outputs.name }}'
          stem="$name-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "$stem.tar.gz" "$name"
          echo "ASSET=$stem.tar.gz" >> "$GITHUB_ENV"

      - name: Archive (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          name='${{ steps.pkg.outputs.name }}'
          stem="$name-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          7z a "$stem.zip" "./target/${{ matrix.target }}/release/$name.exe"
          echo "ASSET=$stem.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

      # Generated by the binary itself, from the same clap definitions as
      # --help, so they cannot document a CLI this build does not have.
      #
      # Once, on the one target whose binary this runner can actually execute —
      # the output is identical everywhere, and running a cross-compiled binary
      # to produce it is how a release job starts failing on the wrong runner.
      - name: Completions and man page
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -eu
          name='${{ steps.pkg.outputs.name }}'
          bin="target/${{ matrix.target }}/release/$name"
          mkdir -p dist
          for shell in bash zsh fish; do
            "$bin" completions "$shell" > "dist/$name.$shell"
          done
          "$bin" man > "dist/$name.1"
          asset="$name-${GITHUB_REF_NAME#v}-completions-and-man.tar.gz"
          tar -czf "$asset" -C dist .
          echo "EXTRA=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: completions-and-man
          path: ${{ env.EXTRA }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only write this workflow needs. Anything broader would let a
      # compromised dependency in the build push to the repository itself.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file for the whole release: without it there is no way for
      # anyone to tell a downloaded binary from a substituted one.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag ./*
