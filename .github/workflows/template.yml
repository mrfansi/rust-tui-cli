name: Template

# This repository is a template, so the path a NEW USER takes has to be tested,
# not just the path the maintainer takes. It is the only path that is never
# exercised by ordinary work here.
#
# In its own file rather than a job in ci.yml so that `rename.sh` can delete it
# outright. A project made from this template has already been renamed and the
# script has removed itself, so this job could only ever fail there — and a red
# tick on the first push of a new project is a bad first impression that costs
# real time to diagnose.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename
        run: ./rename.sh renamed-tool --no-commit

      - name: The name propagated, and the template's own traces are gone
        run: |
          set -eu
          grep -q '^name = "renamed-tool"$' Cargo.toml
          test ! -e rename.sh
          test ! -e .github/workflows/template.yml
          ! grep -q 'badge.svg' README.md
          ! grep -qE '^(description|keywords|categories) = ' Cargo.toml
          ! grep -rn 'rust-tui-cli' Cargo.toml Cargo.lock README.md

      - name: The renamed project still builds and tests
        run: cargo test

      - name: And the binary answers to its new name
        # Block scalar: a plain one containing ": " parses as a nested mapping.
        run: |
          cargo run --quiet -- --help | grep -q 'Usage: renamed-tool'
